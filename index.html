<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="refresh"
      content="0; url=https://voetupper-serra-v3.joyceradis.chatgpt.site/?demo=1"
    />
    <link
      rel="canonical"
      href="https://voetupper-serra-v3.joyceradis.chatgpt.site/?demo=1"
    />
    <title>VoeTupper V3</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff7fa;
        color: #341521;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(420px, calc(100% - 48px));
        padding: 36px;
        border: 1px solid #f2d6e0;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 24px 70px rgb(150 25 76 / 12%);
        text-align: center;
      }

      img {
        width: 92px;
        height: 92px;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 22px;
        color: #775762;
      }

      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border-radius: 999px;
        background: #e91e63;
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="public/logo-192.png" alt="Logo VoeTupper" />
      <h1>Abrindo o VoeTupper V3</h1>
      <p>Você será levada para a versão atual.</p>
      <a href="https://voetupper-serra-v3.joyceradis.chatgpt.site/?demo=1">
        Abrir agora
      </a>
    </main>
    <script>
      (() => {
        const currentQuery = window.location.search;
        const hasDemo = /(?:^\?|&)demo=/.test(currentQuery);
        const query = currentQuery
          ? `${currentQuery}${hasDemo ? '' : '&demo=1'}`
          : '?demo=1';

        window.location.replace(
          `https://voetupper-serra-v3.joyceradis.chatgpt.site/${query}${window.location.hash}`,
        );
      })();
    </script>
  </body>
</html>
