<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14231d"><title>Voa — Operação de vendas</title><style>:root{--ink:#14231d;--muted:#65736d;--paper:#f7f8f5;--card:#fff;--line:#dfe5e1;--accent:#1f7a52;--soft:#e7efe9;--danger:#9b2c2c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding:18px 16px 96px}.top,.row,.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.top{margin-bottom:18px}.brand{font-size:24px;font-weight:900;letter-spacing:-.05em}.eyebrow{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.09em}.cycle{background:var(--soft);border-radius:999px;padding:8px 11px;font-size:13px;font-weight:800}.hero{background:var(--ink);color:white;border-radius:22px;padding:21px}.hero h1{font-size:29px;line-height:1.05;margin:6px 0}.hero p{margin:0;color:#dce6e1}.primary{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:850;margin-top:16px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.metric,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.metric strong{display:block;font-size:26px}.metric span,small{color:var(--muted);font-size:13px}.section{margin-top:22px}.sectionhead{align-items:end;margin-bottom:9px}.section h2,.sectionhead h1{margin:0}.sectionhead h1{font-size:28px}.stack{display:grid;gap:9px}.row main{min-width:0;flex:1}.row strong,.row small{display:block}.row small{margin-top:3px}.action,.linkbtn{border:1px solid var(--line);background:white;border-radius:12px;min-height:42px;padding:0 12px;font-weight:750;color:var(--accent)}.linkbtn{border:0;background:transparent;color:var(--danger);min-height:32px}.actions{display:flex;align-items:center;gap:4px}.progress{height:8px;background:#e5e9e6;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--accent)}.money{font-size:24px;font-weight:850}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.navinner{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px max(7px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;min-height:48px;color:var(--muted);font-size:12px;font-weight:750}.nav button.active{color:var(--accent)}.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:13px;font-weight:750}.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:white;padding:11px}.field textarea{min-height:80px;resize:vertical}.sheet{position:fixed;inset:0;background:rgba(20,35,29,.42);display:flex;align-items:flex-end;z-index:10}.sheetbox{width:min(760px,100%);margin:auto;background:var(--paper);border-radius:24px 24px 0 0;padding:18px 16px max(20px,env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheettitle{display:flex;justify-content:space-between;align-items:center}.iconbtn{border:0;background:transparent;font-size:28px}.empty{text-align:center;color:var(--muted);padding:24px}.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:99px;background:var(--soft);white-space:nowrap}.notice{font-size:12px;color:var(--muted);text-align:center;margin:18px 0}.danger{color:var(--danger)}@media(min-width:640px){.metrics{grid-template-columns:repeat(4,1fr)}.app{padding-top:28px}.hero{padding:26px}}</style></head><body><div id="root"></div><script>
const KEY='voa-pilot-v1';const week={id:'week-demo',label:'Semana atual',campaignId:'campaign-demo',goal:5000};const stages=['RECEIVED','ORGANIZED','PORTAL_DONE','CONFIRMATION_SENT','COMPLETED'];const actions={RECEIVED:'Organizar pedido',ORGANIZED:'Lançar no portal',PORTAL_DONE:'Enviar confirmação',CONFIRMATION_SENT:'Finalizar',COMPLETED:'Concluído',CANCELLED:'Cancelado'};let state=load();let tab='today';let modal=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.consultants)&&Array.isArray(x.orders))return x}catch(e){}return{consultants:[{id:'c1',name:'Consultora exemplo',code:'000001',phone:'',status:'ACTIVE'}],orders:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0)}function pending(){return state.orders.filter(o=>!['COMPLETED','CANCELLED'].includes(o.stage))}function person(id){return state.consultants.find(c=>c.id===id)?.name||'Consultora'}function summary(){const active=state.consultants.filter(c=>['ACTIVE','NEW'].includes(c.status));const done=new Set(state.orders.filter(o=>o.stage==='COMPLETED').map(o=>o.consultantId));const p=pending();const realized=state.orders.filter(o=>o.stage!=='CANCELLED').reduce((s,o)=>s+(o.amount||0),0);return{p,realized,portal:p.filter(o=>o.stage==='ORGANIZED').length,confirm:p.filter(o=>o.stage==='PORTAL_DONE').length,noOrder:active.filter(c=>!done.has(c.id)).length}}
function card(o){return `<div class="card row"><main><strong>${esc(person(o.consultantId))}</strong><small>${esc(o.summary)}${o.amount!=null?' · '+money(o.amount):''}</small><span class="badge">${esc(actions[o.stage])}</span></main>${!['COMPLETED','CANCELLED'].includes(o.stage)?`<div class="actions"><button class="action" onclick="advance('${o.id}')">${esc(actions[o.stage])}</button><button class="linkbtn" onclick="cancelOrder('${o.id}')">Cancelar</button></div>`:''}</div>`}
function today(){const s=summary();return `<section class="hero"><div class="eyebrow">Agora</div><h1>${s.p.length?s.p.length+' pedido'+(s.p.length>1?'s':'')+' precisa de você':'Tudo sob controle'}</h1><p>${s.p.length?'Resolva a fila. O que for concluído desaparece daqui.':'Quando chegar um pedido, registre em poucos segundos.'}</p><button class="primary" onclick="openOrder()">+ Novo pedido</button></section><div class="metrics"><div class="metric"><strong>${s.p.length}</strong><span>pendentes</span></div><div class="metric"><strong>${s.portal}</strong><span>para portal</span></div><div class="metric"><strong>${s.confirm}</strong><span>confirmar</span></div><div class="metric"><strong>${s.noOrder}</strong><span>sem pedido concluído</span></div></div><section class="card"><div class="row"><div><div class="eyebrow">Produção da semana</div><div class="money">${money(s.realized)}</div></div><strong>${Math.round(s.realized/week.goal*100)}%</strong></div><div class="progress"><i style="width:${Math.min(100,s.realized/week.goal*100)}%"></i></div><small>Meta ${money(week.goal)}</small></section><section class="section"><div class="sectionhead"><h2>Faça agora</h2><button class="action" onclick="go('closing')">Ver fechamento</button></div><div class="stack">${s.p.length?s.p.slice(0,3).map(card).join(''):'<div class="empty">Nenhuma ação pendente.</div>'}</div></section><section class="section"><h2>Incentivos</h2><div class="card">Cadastre aqui o incentivo da semana</div></section><div class="notice">Piloto local: seus testes ficam salvos somente neste navegador.</div>`}
function orders(){return `<div class="sectionhead"><div><div class="eyebrow">Histórico</div><h1>Pedidos</h1></div><button class="action" onclick="openOrder()">+ Novo</button></div><div class="section stack">${state.orders.length?state.orders.map(card).join(''):'<div class="empty">Nenhum pedido ainda.</div>'}</div>`}function closing(){const p=pending();return `<div class="sectionhead"><div><div class="eyebrow">Semana atual</div><h1>Fechamento</h1></div><strong>${p.length} aberto${p.length===1?'':'s'}</strong></div><p style="color:var(--muted)">Só aparece o que ainda exige ação.</p><div class="stack">${p.length?p.map(card).join(''):'<div class="empty card">Fila zerada. Nada para perseguir.</div>'}</div>`}function team(){return `<div class="sectionhead"><div><div class="eyebrow">Pessoas</div><h1>Equipe</h1></div><button class="action" onclick="openPerson()">+ Consultora</button></div><div class="stack">${state.consultants.map(c=>`<div class="card row"><main><strong>${esc(c.name)}</strong><small>${c.code?'Código '+esc(c.code)+' · ':''}${c.status==='ACTIVE'?'Ativa':'Nova'}</small></main>${c.phone?`<a class="action" style="display:grid;place-items:center;text-decoration:none" href="https://wa.me/${c.phone.replace(/\D/g,'')}">WhatsApp</a>`:''}</div>`).join('')}</div>`}
function render(){document.getElementById('root').innerHTML=`<div class="app"><header class="top"><div><div class="brand">Voa</div><div class="eyebrow">operação de vendas</div></div><div class="cycle">${week.label}</div></header>${tab==='today'?today():tab==='orders'?orders():tab==='closing'?closing():team()}</div><nav class="nav"><div class="navinner">${[['today','Hoje'],['orders','Pedidos'],['closing','Fechamento'],['team','Equipe']].map(([id,l])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')">${l}</button>`).join('')}</div></nav>${modal||''}`}
function go(t){tab=t;modal=null;render()}function advance(id){state.orders=state.orders.map(o=>{if(o.id!==id)return o;const i=stages.indexOf(o.stage);return i>=0&&i<stages.length-1?{...o,stage:stages[i+1]}:o});save();render()}function cancelOrder(id){if(confirm('Cancelar este pedido?')){state.orders=state.orders.map(o=>o.id===id?{...o,stage:'CANCELLED'}:o);save();render()}}
function openOrder(){const opts=state.consultants.filter(c=>['ACTIVE','NEW'].includes(c.status)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');modal=`<div class="sheet"><form class="sheetbox" onsubmit="addOrder(event)"><div class="sheettitle"><div><div class="eyebrow">${week.label}</div><h2>Novo pedido</h2></div><button type="button" class="iconbtn" onclick="closeModal()">×</button></div><div class="field"><label>Consultora</label><select id="oc" required>${opts}</select></div><div class="field"><label>Chegou como</label><select id="os"><option value="TEXT">Texto</option><option value="AUDIO">Áudio</option><option value="PHOTO">Foto</option><option value="OTHER">Outro</option></select></div><div class="field"><label>Resumo do pedido</label><textarea id="od" placeholder="Ex.: 2 potes + 1 garrafa" required></textarea></div><div class="field"><label>Valor, se souber</label><input id="oa" inputmode="decimal" placeholder="0,00"><small id="oe" class="danger"></small></div><button class="primary">Salvar pedido</button></form></div>`;render()}
function addOrder(e){e.preventDefault();const raw=document.getElementById('oa').value.trim();let amount;if(raw){amount=Number(raw.replace(/\./g,'').replace(',','.'));if(!Number.isFinite(amount)||amount<0){document.getElementById('oe').textContent='Informe um valor válido.';return}}state.orders.unshift({id:crypto.randomUUID(),consultantId:document.getElementById('oc').value,summary:document.getElementById('od').value.trim(),amount,source:document.getElementById('os').value,stage:'RECEIVED',createdAt:new Date().toISOString()});save();modal=null;tab='today';render()}
function openPerson(){modal=`<div class="sheet"><form class="sheetbox" onsubmit="addPerson(event)"><div class="sheettitle"><h2>Nova consultora</h2><button type="button" class="iconbtn" onclick="closeModal()">×</button></div><div class="field"><label>Nome</label><input id="pn" required minlength="2"></div><div class="field"><label>Código, se usar</label><input id="pc"></div><div class="field"><label>Telefone, opcional</label><input id="pp" inputmode="tel"></div><button class="primary">Adicionar à equipe</button></form></div>`;render()}function addPerson(e){e.preventDefault();state.consultants.push({id:crypto.randomUUID(),name:document.getElementById('pn').value.trim(),code:document.getElementById('pc').value.trim(),phone:document.getElementById('pp').value.trim(),status:'ACTIVE'});save();modal=null;render()}function closeModal(){modal=null;render()}render();
</script></body></html>
