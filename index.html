<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f72578"><title>VoeTupper — Operação de vendas</title><style>
:root{--pink:#f72578;--pink2:#ff5fa2;--pink3:#fff0f6;--pink4:#ffd8e8;--ink:#201a22;--muted:#756b73;--paper:#fffafd;--card:#fff;--line:#f1e5eb;--green:#198754;--amber:#e78a16;--shadow:0 12px 35px rgba(95,39,65,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fffafd,#fff 50%,#fff6fa);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:238px;background:#fff;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;z-index:10}.logo{display:flex;align-items:center;gap:11px;padding:0 10px 28px}.mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--pink),#ff85b7);display:grid;place-items:center;color:#fff;font-size:24px;box-shadow:0 9px 20px #f7257830}.brand{font-size:22px;font-weight:900;letter-spacing:-.04em;color:var(--pink)}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}.menu{display:grid;gap:6px}.menu button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:13px;color:#5f565e;font-weight:700}.menu button.active{background:var(--pink3);color:var(--pink)}.menu button span{display:inline-block;width:27px}.sidepromo{margin-top:auto;background:linear-gradient(145deg,#fff0f6,#ffe1ed);border:1px solid #ffd5e5;border-radius:18px;padding:16px}.sidepromo strong{color:var(--pink)}.sidepromo p{font-size:12px;line-height:1.5}.profile{margin-top:14px;padding:12px;border-radius:15px;background:#fff8fb;font-size:13px;font-weight:800}.main{margin-left:238px;padding:28px 34px 100px;max-width:1540px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:27px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:13px;margin-top:4px}.topactions{display:flex;gap:10px;align-items:center}.pill,.outline,.primary{border-radius:13px;min-height:44px;padding:0 15px;font-weight:800}.pill,.outline{border:1px solid var(--line);background:#fff;color:var(--ink)}.primary{border:0;background:linear-gradient(135deg,var(--pink),#ec176a);color:#fff;box-shadow:0 8px 20px #f7257830}.hero{background:linear-gradient(110deg,#fff0f6,#ffe3ef 55%,#fff6fa);border:1px solid #ffcfe1;border-radius:24px;padding:26px;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:before{content:'✦';position:absolute;font-size:180px;color:#fff8;left:34%;top:-55px}.hero h2{font-size:29px;margin:4px 0 7px;color:#c6175c;letter-spacing:-.03em}.hero p{margin:0;color:#7c4d61}.heroart{display:flex;gap:14px;align-items:center}.balloon{width:100px;height:116px;border-radius:52% 48% 45% 45%;background:radial-gradient(circle at 35% 30%,#ffb3d0,var(--pink));position:relative;box-shadow:inset -12px -8px 22px #c8115850}.balloon:after{content:'';position:absolute;width:2px;height:70px;background:#d88aa9;left:50%;top:112px}.heroMetrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:center}.hmetric{background:#ffffffb8;border:1px solid #fff;border-radius:18px;padding:15px;text-align:center}.hmetric strong{font-size:27px;color:var(--pink);display:block}.hmetric span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.eyebrow{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.09em}.money{font-size:31px;font-weight:900;color:var(--pink);letter-spacing:-.04em}.percent{font-size:28px;font-weight:900;color:var(--pink)}.progress{height:10px;background:#f8e7ef;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{height:100%;display:block;background:linear-gradient(90deg,var(--pink),var(--pink2));border-radius:99px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted,small{color:var(--muted)}.actionslist{display:grid;gap:9px}.actionrow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff}.count{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:white;font-size:12px;font-weight:900}.count.amber{background:#ffab36}.actionrow main{flex:1;font-size:13px;font-weight:700}.orders{margin-top:18px}.order{display:grid;grid-template-columns:1.4fr .7fr .7fr .7fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.order:last-child{border:0}.person{display:flex;gap:10px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pink3);color:var(--pink);font-weight:900}.badge{display:inline-flex;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900;background:var(--pink3);color:var(--pink)}.badge.green{background:#eaf8ef;color:var(--green)}.badge.amber{background:#fff4df;color:var(--amber)}.incentive{background:linear-gradient(145deg,#fff,#fff4f8)}.reward{border:1px solid #f5dfe8;border-radius:16px;padding:14px;margin-top:12px;display:flex;align-items:center;gap:12px}.gift{width:55px;height:55px;border-radius:14px;background:linear-gradient(135deg,#ff9dc2,var(--pink));display:grid;place-items:center;font-size:28px}.sectiontitle{font-size:18px;font-weight:900;margin:0}.empty{padding:25px;text-align:center;color:var(--muted)}.mobileNav{display:none}.sheet{position:fixed;inset:0;background:#30131f70;display:flex;align-items:flex-end;z-index:30}.sheetbox{width:min(600px,100%);margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px;max-height:92vh;overflow:auto}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:12px;min-height:46px}.field textarea{min-height:82px}.sheettitle{display:flex;justify-content:space-between;align-items:center}.iconbtn{border:0;background:none;font-size:27px}.teamgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.teamcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.link{color:var(--pink);font-weight:800;text-decoration:none}.notice{font-size:11px;color:var(--muted);margin-top:16px;text-align:center}
@media(max-width:900px){.sidebar{display:none}.main{margin:0;padding:18px 15px 90px}.top{align-items:flex-start}.topactions .pill{display:none}.hero{grid-template-columns:1fr;padding:20px}.heroart{display:none}.grid{grid-template-columns:1fr}.teamgrid{grid-template-columns:1fr}.order{grid-template-columns:1.4fr .8fr auto}.order .hideMob{display:none}.mobileNav{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(4,1fr);background:#fffcfded;backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:20;padding:7px 4px max(7px,env(safe-area-inset-bottom))}.mobileNav button{border:0;background:none;color:var(--muted);font-size:11px;font-weight:800;min-height:48px}.mobileNav button.active{color:var(--pink)}.top h1{font-size:22px}.hero h2{font-size:25px}}
</style></head><body><div id="root"></div><script>
const KEY='voetupper-pilot-v2',week={id:'w',label:'Semana atual',vitrine:'Vitrine atual',goal:5000},stages=['RECEIVED','ORGANIZED','PORTAL_DONE','CONFIRMATION_SENT','COMPLETED'],labels={RECEIVED:'Organizar',ORGANIZED:'Enviar ao portal',PORTAL_DONE:'Confirmar',CONFIRMATION_SENT:'Finalizar',COMPLETED:'Concluído',CANCELLED:'Cancelado'};let tab='today',modal=null,state=load();function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x)return x}catch(e){}return{consultants:[{id:'c1',name:'Consultora exemplo',code:'000001',phone:'',status:'ACTIVE'}],orders:[]}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n||0)}function person(id){return state.consultants.find(c=>c.id===id)?.name||'Consultora'}function pending(){return state.orders.filter(o=>!['COMPLETED','CANCELLED'].includes(o.stage))}function sum(){let p=pending(),realized=state.orders.filter(o=>o.stage!=='CANCELLED').reduce((s,o)=>s+(o.amount||0),0),done=new Set(state.orders.filter(o=>o.stage==='COMPLETED').map(o=>o.consultantId));return{p,realized,portal:p.filter(o=>o.stage==='ORGANIZED').length,confirm:p.filter(o=>o.stage==='PORTAL_DONE').length,noOrder:state.consultants.filter(c=>['ACTIVE','NEW'].includes(c.status)&&!done.has(c.id)).length}}
function menu(){return [['today','⌂','Hoje'],['orders','▣','Pedidos'],['closing','✓','Fechamento'],['team','♙','Equipe']].map(([id,ic,l])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${l}</button>`).join('')}function top(){return `<div class="top"><div><h1>${tab==='today'?'Bom dia! 🌸':tab==='orders'?'Pedidos':tab==='closing'?'Fechamento':'Equipe'}</h1><div class="sub">${tab==='today'?'Sua operação, organizada para você.':'Semana atual · '+week.vitrine}</div></div><div class="topactions"><button class="pill">▣ ${week.label}⌄</button><button class="pill">◇ ${week.vitrine}⌄</button><button class="primary" onclick="openOrder()">＋ Novo pedido</button></div></div>`}
function orderRow(o){let terminal=['COMPLETED','CANCELLED'].includes(o.stage);return `<div class="order"><div class="person"><div class="avatar">${esc(person(o.consultantId).slice(0,2).toUpperCase())}</div><div><strong>${esc(person(o.consultantId))}</strong><small style="display:block">${esc(o.summary)}</small></div></div><div class="hideMob"><span class="badge ${o.stage==='COMPLETED'?'green':o.stage==='PORTAL_DONE'?'amber':''}">${labels[o.stage]}</span></div><strong>${o.amount!=null?money(o.amount):'—'}</strong><small class="hideMob">${new Date(o.createdAt).toLocaleDateString('pt-BR')}</small><div>${!terminal?`<button class="outline" onclick="advance('${o.id}')">${labels[o.stage]}</button>`:''}</div></div>`}
function today(){let s=sum(),pct=Math.min(100,Math.round(s.realized/week.goal*100));return `<section class="hero"><div class="heroart"><div class="balloon"></div><div><div class="eyebrow" style="color:#e11c68">Seu negócio, do seu jeito.</div><h2>A gente junto, voa mais alto! ♡</h2><p>Foque no que importa hoje. O VoeTupper organiza o restante.</p></div></div><div class="heroMetrics"><div class="hmetric"><strong>${s.p.length}</strong><span>Pendentes</span></div><div class="hmetric"><strong>${s.portal}</strong><span>Para portal</span></div><div class="hmetric"><strong>${s.confirm}</strong><span>Para confirmar</span></div><div class="hmetric"><strong>${state.orders.filter(o=>o.stage==='COMPLETED').length}</strong><span>Concluídos</span></div></div></section><div class="grid"><section class="card"><div class="cardhead"><div><div class="eyebrow">Produção da semana</div><div class="money">${money(s.realized)}</div></div><div class="percent">${pct}%</div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="row"><small>Meta: ${money(week.goal)}</small><small>Faltam ${money(Math.max(0,week.goal-s.realized))}</small></div></section><section class="card"><div class="cardhead"><h3 class="sectiontitle">Ações mais importantes</h3></div><div class="actionslist"><div class="actionrow"><span class="count">${s.portal}</span><main>Pedidos prontos para envio ao portal</main><span>›</span></div><div class="actionrow"><span class="count amber">${s.confirm}</span><main>Confirmações pendentes</main><span>›</span></div><div class="actionrow"><span class="count">${s.p.length}</span><main>Total de pedidos que ainda exigem ação</main><span>›</span></div></div></section></div><div class="grid"><section class="card orders"><div class="cardhead"><h3 class="sectiontitle">Últimos pedidos</h3><button class="outline" onclick="go('orders')">Ver todos</button></div>${state.orders.length?state.orders.slice(0,4).map(orderRow).join(''):'<div class="empty">Nenhum pedido ainda. Use “Novo pedido” para testar o fluxo.</div>'}</section><section class="card incentive"><div class="cardhead"><div><div class="eyebrow">Incentivo da semana</div><h3 class="sectiontitle" style="color:var(--pink);margin-top:5px">Rumo ao próximo nível!</h3></div><div class="percent">${pct}%</div></div><p class="muted">Faltam ${money(Math.max(0,week.goal-s.realized))} para alcançar a meta da semana.</p><div class="reward"><div class="gift">🎁</div><div><strong>Reconhecimento da semana</strong><small style="display:block">Configure aqui o incentivo vigente.</small></div></div></section></div><div class="notice">Piloto: os dados de teste ficam salvos somente neste navegador.</div>`}
function orders(){return `<section class="card"><div class="cardhead"><div><div class="eyebrow">Histórico operacional</div><h2 style="margin:4px 0">Pedidos</h2></div><button class="primary" onclick="openOrder()">＋ Novo pedido</button></div>${state.orders.length?state.orders.map(orderRow).join(''):'<div class="empty">Nenhum pedido cadastrado.</div>'}</section>`}function closing(){let p=pending();return `<section class="card"><div class="cardhead"><div><div class="eyebrow">Só o que exige ação</div><h2 style="margin:4px 0">${p.length} pendência${p.length===1?'':'s'}</h2></div></div>${p.length?p.map(orderRow).join(''):'<div class="empty">✨ Fechamento limpo. Nada pendente.</div>'}</section>`}function team(){return `<div class="cardhead"><div><div class="eyebrow">Rede</div><h2 style="margin:4px 0">Equipe</h2></div><button class="primary" onclick="openPerson()">＋ Consultora</button></div><div class="teamgrid">${state.consultants.map(c=>`<div class="teamcard"><div class="person"><div class="avatar">${esc(c.name.slice(0,2).toUpperCase())}</div><div><strong>${esc(c.name)}</strong><small style="display:block">${c.code?'Código '+esc(c.code):'Sem código'}</small></div></div>${c.phone?`<p><a class="link" href="https://wa.me/${c.phone.replace(/\D/g,'')}">Abrir WhatsApp ↗</a></p>`:''}</div>`).join('')}</div>`}
function render(){document.getElementById('root').innerHTML=`<div class="shell"><aside class="sidebar"><div class="logo"><div class="mark">♡</div><div class="brand">VoeTupper<small>operação de vendas</small></div></div><div class="menu">${menu()}</div><div class="sidepromo"><strong>Você está voando!</strong><p>Cada pedido organizado deixa o fechamento mais leve.</p></div><div class="profile">🌸 Sua equipe</div></aside><main class="main">${top()}${tab==='today'?today():tab==='orders'?orders():tab==='closing'?closing():team()}</main><nav class="mobileNav">${menu()}</nav>${modal||''}</div>`}function go(t){tab=t;modal=null;render()}function advance(id){state.orders=state.orders.map(o=>{if(o.id!==id)return o;let i=stages.indexOf(o.stage);return i>=0&&i<stages.length-1?{...o,stage:stages[i+1]}:o});save();render()}
function openOrder(){let opts=state.consultants.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');modal=`<div class="sheet"><form class="sheetbox" onsubmit="addOrder(event)"><div class="sheettitle"><div><div class="eyebrow">${week.label}</div><h2>Novo pedido</h2></div><button type="button" class="iconbtn" onclick="closeModal()">×</button></div><div class="field"><label>Consultora</label><select id="oc" required>${opts}</select></div><div class="field"><label>Chegou como</label><select id="os"><option>Texto</option><option>Áudio</option><option>Foto</option><option>Outro</option></select></div><div class="field"><label>Resumo do pedido</label><textarea id="od" required placeholder="Ex.: 2 potes + 1 garrafa"></textarea></div><div class="field"><label>Valor</label><input id="oa" inputmode="decimal" placeholder="0,00"><small id="err" style="color:#b42318"></small></div><button class="primary" style="width:100%">Salvar pedido</button></form></div>`;render()}function addOrder(e){e.preventDefault();let raw=document.getElementById('oa').value.trim(),amount;if(raw){amount=Number(raw.replace(/\./g,'').replace(',','.'));if(!Number.isFinite(amount)||amount<0){document.getElementById('err').textContent='Informe um valor válido.';return}}state.orders.unshift({id:crypto.randomUUID(),consultantId:document.getElementById('oc').value,summary:document.getElementById('od').value.trim(),amount,stage:'RECEIVED',createdAt:new Date().toISOString()});save();modal=null;tab='today';render()}function openPerson(){modal=`<div class="sheet"><form class="sheetbox" onsubmit="addPerson(event)"><div class="sheettitle"><h2>Nova consultora</h2><button type="button" class="iconbtn" onclick="closeModal()">×</button></div><div class="field"><label>Nome</label><input id="pn" required minlength="2"></div><div class="field"><label>Código</label><input id="pc"></div><div class="field"><label>Telefone</label><input id="pp" inputmode="tel"></div><button class="primary" style="width:100%">Adicionar</button></form></div>`;render()}function addPerson(e){e.preventDefault();state.consultants.push({id:crypto.randomUUID(),name:document.getElementById('pn').value.trim(),code:document.getElementById('pc').value.trim(),phone:document.getElementById('pp').value.trim(),status:'ACTIVE'});save();modal=null;render()}function closeModal(){modal=null;render()}render();
</script></body></html>
